<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="h-full flex flex-col font-sans antialiased overflow-hidden">
    <!-- Top Navigation Bar -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3.5 flex items-center justify-between z-30 shrink-0">
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-600 to-emerald-400 flex items-center justify-center shadow-lg shadow-teal-500/20">
                    <i class="fa-solid fa-truck-fast text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        FleetFlow
                        <span class="text-xs px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-400 border border-teal-500/20 font-medium">Logistics AI</span>
                    </h1>
                    <p class="text-xs text-slate-400">Intelligent Fleet & Real-Time Logistics Routing</p>
                </div>
            </div>
        </div>

        <!-- Navigation Links -->
        <nav class="flex items-center space-x-1">
            <a href="/" class="px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 {% if active_tab == 'dashboard' %}bg-teal-500/15 text-teal-400 border border-teal-500/30{% else %}text-slate-400 hover:text-white hover:bg-slate-800/60{% endif %}">
                <i class="fa-solid fa-map-location-dot"></i>
                <span>Live Map</span>
            </a>
            <a href="/vehicles" class="px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 {% if active_tab == 'vehicles' %}bg-teal-500/15 text-teal-400 border border-teal-500/30{% else %}text-slate-400 hover:text-white hover:bg-slate-800/60{% endif %}">
                <i class="fa-solid fa-truck"></i>
                <span>Fleet & Drivers</span>
            </a>
            <a href="/orders" class="px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 {% if active_tab == 'orders' %}bg-teal-500/15 text-teal-400 border border-teal-500/30{% else %}text-slate-400 hover:text-white hover:bg-slate-800/60{% endif %}">
                <i class="fa-solid fa-box-open"></i>
                <span>Orders & Dispatch</span>
            </a>
            <a href="/analytics" class="px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 {% if active_tab == 'analytics' %}bg-teal-500/15 text-teal-400 border border-teal-500/30{% else %}text-slate-400 hover:text-white hover:bg-slate-800/60{% endif %}">
                <i class="fa-solid fa-chart-line"></i>
                <span>Analytics & KPIs</span>
            </a>
        </nav>

        <!-- Right System Status & Quick Actions -->
        <div class="flex items-center space-x-3">
            <div id="ws-status" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800/80 border border-slate-700/60 text-xs font-mono text-slate-300">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="ws-status-text">Live Telemetry</span>
            </div>
            <a href="/docs" target="_blank" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 border border-slate-700 transition flex items-center gap-1.5">
                <i class="fa-solid fa-code"></i>
                <span>API Docs</span>
            </a>
            <button onclick="resetDemoData()" title="Reset to initial clean demo state" class="px-3 py-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs font-medium transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-left"></i>
                <span>Reset Demo</span>
            </button>
        </div>
    </header>

    <!-- Main Content Body -->
    <main class="flex-1 flex overflow-hidden relative">
        {% block content %}{% endblock %}
    </main>

    <!-- Shared Notification Toast -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Base Scripts -->
    <script src="/static/js/websocket.js"></script>
    <script>
        async function resetDemoData() {
            if (!confirm("Reset database to clean initial state with sample fleet, drivers, and orders?")) return;
            try {
                const res = await fetch('/api/analytics/seed/reset', { method: 'POST' });
                if (res.ok) {
                    showToast("Fleet data successfully reset!", "success");
                    setTimeout(() => window.location.reload(), 800);
                } else {
                    showToast("Failed to reset demo data.", "error");
                }
            } catch (err) {
                showToast("Network error resetting data.", "error");
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-emerald-950 border-emerald-500/40 text-emerald-300',
                error: 'bg-rose-950 border-rose-500/40 text-rose-300',
                info: 'bg-slate-900 border-teal-500/40 text-teal-300'
            };
            const icons = {
                success: 'fa-circle-check',
                error: 'fa-triangle-exclamation',
                info: 'fa-circle-info'
            };
            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border shadow-xl transition-all duration-300 transform translate-y-2 opacity-0 text-sm ${colors[type] || colors.info}`;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 text-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/ui_crest.svg">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        uinavy: {
                            DEFAULT: '#002147',
                            dark: '#001630',
                            light: '#0a3466',
                            50: '#f0f4f9',
                            100: '#dce5f1',
                            200: '#bccde4',
                        },
                        uigold: {
                            DEFAULT: '#C59B27',
                            light: '#E5C058',
                            dark: '#9E7914',
                            50: '#fdf9ee',
                            100: '#f9f0d1',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Three.js & OrbitControls for 3D Digital Twin Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="h-full flex flex-col font-sans antialiased overflow-hidden bg-slate-50 selection:bg-uinavy-100 selection:text-uinavy">
    <!-- Top Header Bar (Light Theme, Crisp UI) -->
    <header class="bg-white border-b border-slate-200/90 px-4 sm:px-6 py-2.5 flex items-center justify-between z-30 shrink-0 shadow-sm">
        <!-- Brand & Identity -->
        <div class="flex items-center space-x-3 sm:space-x-4">
            <a href="/" class="flex items-center gap-2.5 sm:gap-3 group">
                <img src="/static/images/ui_crest.svg" alt="University of Ibadan Crest" class="w-8 h-8 sm:w-9 sm:h-9">
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-bold tracking-tight text-uinavy group-hover:text-uinavy-light transition">UI-FleetFlow</span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-uinavy-50 text-uinavy font-semibold border border-uinavy-200 hidden sm:inline-block">Academic Case Study</span>
                    </div>
                    <div class="text-[11px] text-slate-500 font-medium hidden sm:block">Campus Logistics & Real-Time Tracking</div>
                </div>
            </a>
        </div>

        <!-- Desktop Navigation Links -->
        <nav class="hidden lg:flex items-center space-x-1">
            <a href="/" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 {% if active_tab == 'dashboard' %}bg-uinavy text-white shadow-sm{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                <i class="fa-solid fa-map-location-dot text-[11px] {% if active_tab == 'dashboard' %}text-uigold-light{% else %}text-slate-400{% endif %}"></i>
                <span>Live Map</span>
            </a>
            <a href="/vehicles" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 {% if active_tab == 'vehicles' %}bg-uinavy text-white shadow-sm{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                <i class="fa-solid fa-truck text-[11px] {% if active_tab == 'vehicles' %}text-uigold-light{% else %}text-slate-400{% endif %}"></i>
                <span>Fleet & Drivers</span>
            </a>
            <a href="/orders" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 {% if active_tab == 'orders' %}bg-uinavy text-white shadow-sm{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                <i class="fa-solid fa-box-open text-[11px] {% if active_tab == 'orders' %}text-uigold-light{% else %}text-slate-400{% endif %}"></i>
                <span>Dispatches</span>
            </a>
            <a href="/analytics" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 {% if active_tab == 'analytics' %}bg-uinavy text-white shadow-sm{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                <i class="fa-solid fa-chart-line text-[11px] {% if active_tab == 'analytics' %}text-uigold-light{% else %}text-slate-400{% endif %}"></i>
                <span>Analytics</span>
            </a>
        </nav>

        <!-- Right Utilities & Mobile Menu Button -->
        <div class="flex items-center space-x-2 sm:space-x-3">
            <div id="ws-status" class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-emerald-50 border border-emerald-200 text-[11px] font-mono text-emerald-700 font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="ws-status-text" class="hidden sm:inline">Live Sync</span>
            </div>

            <a href="/docs" target="_blank" class="px-2.5 py-1 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium border border-slate-200 transition flex items-center gap-1.5">
                <i class="fa-solid fa-code text-[10px] text-uinavy"></i>
                <span class="hidden sm:inline">API</span>
            </a>

            <button onclick="resetDemoData()" title="Reset to initial clean campus case study state" class="px-2.5 py-1 rounded-md bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-medium transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-left text-[10px]"></i>
                <span class="hidden sm:inline">Reset</span>
            </button>

            <!-- Mobile Menu Toggle Button -->
            <button onclick="toggleMobileMenu()" class="lg:hidden p-1.5 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-100 border border-slate-200">
                <i class="fa-solid fa-bars text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Mobile Dropdown Navigation -->
    <div id="mobile-menu" class="hidden lg:hidden bg-white border-b border-slate-200 px-4 py-2.5 flex flex-col space-y-1 z-30 shrink-0 shadow-sm">
        <a href="/" class="px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-2 {% if active_tab == 'dashboard' %}bg-uinavy text-white font-semibold{% else %}text-slate-600 hover:bg-slate-100{% endif %}">
            <i class="fa-solid fa-map-location-dot w-4 text-uinavy"></i>
            <span>Live Campus Map</span>
        </a>
        <a href="/vehicles" class="px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-2 {% if active_tab == 'vehicles' %}bg-uinavy text-white font-semibold{% else %}text-slate-600 hover:bg-slate-100{% endif %}">
            <i class="fa-solid fa-truck w-4 text-uinavy"></i>
            <span>Fleet & Drivers</span>
        </a>
        <a href="/orders" class="px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-2 {% if active_tab == 'orders' %}bg-uinavy text-white font-semibold{% else %}text-slate-600 hover:bg-slate-100{% endif %}">
            <i class="fa-solid fa-box-open w-4 text-uinavy"></i>
            <span>Dispatches & Logistics</span>
        </a>
        <a href="/analytics" class="px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-2 {% if active_tab == 'analytics' %}bg-uinavy text-white font-semibold{% else %}text-slate-600 hover:bg-slate-100{% endif %}">
            <i class="fa-solid fa-chart-line w-4 text-uinavy"></i>
            <span>Analytics & KPIs</span>
        </a>
    </div>

    <!-- Main Content Area -->
    <main class="flex-1 flex overflow-hidden relative">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none max-w-sm w-full px-4"></div>

    <script src="/static/js/websocket.js"></script>
    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            if (menu) menu.classList.toggle('hidden');
        }

        async function resetDemoData() {
            if (!confirm("Reset database to clean initial campus case study data?")) return;
            try {
                const res = await fetch('/api/analytics/seed/reset', { method: 'POST' });
                if (res.ok) {
                    showToast("Campus case study data reset successfully.", "success");
                    setTimeout(() => window.location.reload(), 800);
                } else {
                    showToast("Failed to reset data.", "error");
                }
            } catch (err) {
                showToast("Network error resetting data.", "error");
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const borderColors = {
                success: 'border-emerald-200 text-emerald-800 bg-white shadow-emerald-50',
                error: 'border-rose-200 text-rose-800 bg-white shadow-rose-50',
                info: 'border-slate-200 text-slate-800 bg-white shadow-slate-50'
            };
            const icons = {
                success: 'fa-circle-check text-emerald-500',
                error: 'fa-circle-exclamation text-rose-500',
                info: 'fa-circle-info text-uinavy'
            };
            toast.className = `pointer-events-auto flex items-center gap-3 px-3.5 py-2.5 rounded-lg border shadow-lg transition-all duration-200 transform translate-y-2 opacity-0 text-xs ${borderColors[type] || borderColors.info}`;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i> <span class="font-medium">${message}</span>`;
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 250);
            }, 3500);
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
